<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JV Gifts Personalizados - Fazer Pedido</title>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fontes Google -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-[#F8F5F0] text-stone-800 min-h-screen flex flex-col justify-between">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const UploadIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
    );

    const InstagramIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
    );

    const WhatsappIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    );

    function App() {
      const [carregando, setCarregando] = useState(false);
      const [calculandoFrete, setCalculandoFrete] = useState(false);

      const produtos = [
        // KITS E ÍMÃS QUADRADOS
        { id: 'um-ima', nome: '1 Ímã Quadrado', categoria: 'Kits e Ímãs', qtdPadrao: 1, precoPadrao: 12.00, desc: 'Ímã quadrado personalizado (50mm)', peso: 100 },
        { id: 'tres-quadrado', nome: 'Kit 3 ímãs quadrados', categoria: 'Kits e Ímãs', qtdPadrao: 3, precoPadrao: 35.00, desc: '3 ímãs quadrados personalizados (50mm)', peso: 200 },
        { id: 'seis-quadrado', nome: 'Kit 6 ímãs quadrados', categoria: 'Kits e Ímãs', qtdPadrao: 6, precoPadrao: 68.00, desc: '6 ímãs quadrados personalizados (50mm)', peso: 300 },
        { id: 'dez-mais-quadrado', nome: 'Kit 10+ ímãs quadrados', categoria: 'Kits e Ímãs', qtdPadrao: 10, precoPadrao: 100.00, desc: 'A partir de 10 ímãs quadrados (50mm) (R$ 10,00 por unidade)', peso: 400 },
        
        // DEMAIS PRODUTOS PERSONALIZADOS
        { id: 'ima-redondo', nome: 'Ímã Redondo (Unidade)', categoria: 'Outros Produtos', qtdPadrao: 1, precoPadrao: 11.00, desc: 'Ímã redondo personalizado (58mm)', peso: 80 },
        { id: 'botton', nome: 'Botton Personalizado', categoria: 'Outros Produtos', qtdPadrao: 1, precoPadrao: 8.00, desc: 'Botton personalizado com alfinete (58mm)', peso: 50 },
        { id: 'chaveiro', nome: 'Chaveiro Personalizado', categoria: 'Outros Produtos', qtdPadrao: 1, precoPadrao: 9.00, desc: 'Chaveiro personalizado com foto/frase (58mm)', peso: 60 },
        { id: 'espelho', nome: 'Espelho de Bolsa', categoria: 'Outros Produtos', qtdPadrao: 1, precoPadrao: 10.00, desc: 'Espelho de bolso personalizado (58mm)', peso: 80 },
      ];

      const [clienteNome, setClienteNome] = useState('');
      const [clienteWhats, setClienteWhats] = useState('');
      const [produtoSelecionado, setProdutoSelecionado] = useState(produtos[1].id);
      const [qtdCustomizada, setQtdCustomizada] = useState(10);
      const [qtdIndividual, setQtdIndividual] = useState(1);
      const [fotosUpload, setFotosUpload] = useState([]);
      const [usarMesmaFoto, setUsarMesmaFoto] = useState(false);
      const [pedidoSucesso, setPedidoSucesso] = useState(null);
      const [erroEnvio, setErroEnvio] = useState(false);

      // Estados de Frete e Endereço
      const [cepDestino, setCepDestino] = useState('');
      const [tipoEntrega, setTipoEntrega] = useState('local');
      const [opcoesFrete, setOpcoesFrete] = useState([]);
      const [freteSelecionado, setFreteSelecionado] = useState({ nome: 'Retirada na loja', valor: 0.00, prazo: 'Grátis' });
      
      const [rua, setRua] = useState('');
      const [numero, setNumero] = useState('');
      const [bairro, setBairro] = useState('');
      const [complemento, setComplemento] = useState('');

      const URL_DO_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzIsGyzzoRPBsbyjYk0kKEAx0bQhP3_eXigJ1d1eNZWB6JoRAhbLUMM8sryJRy2wgmV/exec";

      const obterDadosCalculados = () => {
        const prodObj = produtos.find(p => p.id === produtoSelecionado);
        if (produtoSelecionado === 'dez-mais-quadrado') {
          const qtd = Math.max(10, parseInt(qtdCustomizada) || 10);
          const preco = qtd * 10.00;
          const peso = 300 + (qtd - 10) * 20;
          return { ...prodObj, qtd, preco, peso };
        }
        if (produtoSelecionado === 'um-ima') {
          const qtd = Math.max(1, parseInt(qtdIndividual) || 1);
          const preco = qtd * 12.00;
          const peso = qtd * 100;
          return { ...prodObj, qtd, preco, peso };
        }
        if (produtoSelecionado === 'ima-redondo') {
          const qtd = Math.max(1, parseInt(qtdIndividual) || 1);
          const preco = qtd * 11.00;
          const peso = qtd * 80;
          return { ...prodObj, qtd, preco, peso };
        }
        if (produtoSelecionado === 'botton') {
          const qtd = Math.max(1, parseInt(qtdIndividual) || 1);
          const preco = qtd * 8.00;
          const peso = qtd * 50;
          return { ...prodObj, qtd, preco, peso };
        }
        if (produtoSelecionado === 'chaveiro') {
          const qtd = Math.max(1, parseInt(qtdIndividual) || 1);
          const preco = qtd * 9.00;
          const peso = qtd * 60;
          return { ...prodObj, qtd, preco, peso };
        }
        if (produtoSelecionado === 'espelho') {
          const qtd = Math.max(1, parseInt(qtdIndividual) || 1);
          const preco = qtd * 10.00;
          const peso = qtd * 80;
          return { ...prodObj, qtd, preco, peso };
        }
        return { ...prodObj, qtd: prodObj.qtdPadrao, preco: prodObj.precoPadrao, peso: prodObj.peso };
      };

      const produtoAtual = obterDadosCalculados();
      
      const quantidadeFotosValida = usarMesmaFoto ? fotosUpload.length === 1 : fotosUpload.length === produtoAtual.qtd;
      
      const valorTotalGeral = produtoAtual.preco + (freteSelecionado.valor || 0);
      const exigeEndereco = freteSelecionado.nome !== 'Retirada na loja';

      const verificarSeEhItapetininga = (cep) => {
        const apenasNum = cep.replace(/\D/g, '');
        if (apenasNum.length !== 8) return false;
        const prefixo = parseInt(apenasNum.substring(0, 5), 10);
        return prefixo >= 18200 && prefixo <= 18215;
      };

      const handleCEPChange = (e) => {
        const novoCep = e.target.value;
        setCepDestino(novoCep);

        const limpo = novoCep.replace(/\D/g, '');
        if (limpo.length === 8) {
          if (verificarSeEhItapetininga(limpo)) {
            setTipoEntrega('local');
            setOpcoesFrete([]);
            setFreteSelecionado({ nome: 'Retirada na loja', valor: 0.00, prazo: 'Grátis' });
          } else {
            setTipoEntrega('correios');
          }
        }
      };

      const handleCalcularFreteCorreios = async () => {
        const limpo = cepDestino.replace(/\D/g, '');
        if (limpo.length < 8) {
          alert("Digite um CEP válido.");
          return;
        }

        setCalculandoFrete(true);
        try {
          const resposta = await fetch(URL_DO_APPS_SCRIPT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              acao: "calcularFrete",
              cepDestino: limpo,
              pesoGramas: produtoAtual.peso
            })
          });

          const dados = await resposta.json();
          if (Array.isArray(dados)) {
            const formatados = dados.map(servico => ({
              nome: servico.name,
              valor: parseFloat(servico.price),
              prazo: `${servico.delivery_time} dias úteis`
            }));
            setOpcoesFrete(formatados);
            if (formatados.length > 0) setFreteSelecionado(formatados[0]);
          } else {
            alert("Erro ao consultar o frete para este CEP.");
          }
        } catch (erro) {
          console.error("Erro frete:", erro);
          alert("Falha ao calcular o frete.");
        } finally {
          setCalculandoFrete(false);
        }
      };

      const handleEnviarPedido = async (e) => {
        e.preventDefault();
        if (!quantidadeFotosValida) {
          if (usarMesmaFoto) {
            alert("Por favor, selecione exatamente 1 foto para ser usada em todos os itens.");
          } else {
            alert(`Por favor, selecione exatamente ${produtoAtual.qtd} foto(s).`);
          }
          return;
        }

        if (exigeEndereco && (!rua.trim() || !numero.trim() || !bairro.trim())) {
          alert("Por favor, preencha o endereço completo para entrega.");
          return;
        }

        setCarregando(true);
        setErroEnvio(false);
        const novoId = `PED-${Math.floor(1000 + Math.random() * 9000)}`;
        
        const enderecoFormatado = exigeEndereco 
          ? `${rua.trim()}, Nº ${numero.trim()} - ${bairro.trim()}${complemento ? ' (' + complemento.trim() + ')' : ''} - CEP: ${cepDestino}`
          : 'Retirada no Ateliê (Sem entrega)';

        const produtoDescricao = usarMesmaFoto 
          ? `${produtoAtual.nome} (${produtoAtual.qtd} unidade(s) - Replicar mesma foto)` 
          : `${produtoAtual.nome} (${produtoAtual.qtd} unidade(s))`;

        const novoPedido = {
          id: novoId,
          cliente: clienteNome,
          kit: produtoDescricao,
          qtdFotos: fotosUpload.length,
          valorTotal: valorTotalGeral,
          freteInfo: `${freteSelecionado.nome} (R$ ${freteSelecionado.valor.toFixed(2)})`,
          whatsapp: clienteWhats,
          endereco: enderecoFormatado
        };

        try {
          const fotosProcessadas = [];
          
          // Otimizado: envia apenas 1 foto com indicador de replicação para evitar payload gigante
          for (let i = 0; i < fotosUpload.length; i++) {
            const base64String = await toBase64(fotosUpload[i]);
            fotosProcessadas.push({
              nome: fotosUpload[i].name,
              tipo: fotosUpload[i].type,
              dados: base64String
            });
          }

          const payload = {
            idPedido: novoId,
            nomeCliente: clienteNome,
            whatsapp: clienteWhats,
            kit: novoPedido.kit,
            valorTotal: valorTotalGeral,
            freteInfo: novoPedido.freteInfo,
            endereco: enderecoFormatado,
            usarMesmaFoto: usarMesmaFoto,
            qtdTotal: produtoAtual.qtd,
            fotos: fotosProcessadas
          };

          const resposta = await fetch(URL_DO_APPS_SCRIPT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });

          if (!resposta.ok) throw new Error("Erro no envio");

          setPedidoSucesso(novoPedido);
          setClienteNome('');
          setClienteWhats('');
          setRua('');
          setNumero('');
          setBairro('');
          setComplemento('');
          setFotosUpload([]);
          setUsarMesmaFoto(false);
          setQtdIndividual(1);
        } catch (erro) {
          console.error("Erro no envio do pedido:", erro);
          alert("Ocorreu um erro ao enviar o pedido. Por favor, tente novamente.");
          setErroEnvio(true);
        } finally {
          setCarregando(false);
        }
      };

      const toBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <header className="bg-gradient-to-r from-[#B89267] via-[#A88258] to-[#8C6740] text-white shadow-md">
            <div className="max-w-4xl mx-auto px-4 py-4 flex items-center space-x-4">
              <div className="w-14 h-14 rounded-xl shadow-md border-2 border-white/40 flex-shrink-0 overflow-hidden">
                <img src="./logo.jpg" alt="Logo JV Gifts" className="w-full h-full object-cover" />
              </div>
              <div>
                <h1 className="text-2xl font-extrabold tracking-wide">JV Gifts Personalizados</h1>
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              
              <div className="md:col-span-2 space-y-6">
                <h2 className="text-2xl font-bold text-[#4A3B2C]">Escolha o seu Produto Personalizado</h2>
                
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {produtos.map((p) => {
                    const estaSelecionado = produtoSelecionado === p.id;
                    const ehDezMais = p.id === 'dez-mais-quadrado';
                    const ehIndividualVariavel = ['um-ima', 'ima-redondo', 'botton', 'chaveiro', 'espelho'].includes(p.id);

                    return (
                      <div
                        key={p.id}
                        onClick={() => setProdutoSelecionado(p.id)}
                        className={`cursor-pointer rounded-2xl p-5 border-2 transition-all relative flex flex-col justify-between ${
                          estaSelecionado ? 'border-[#B89267] bg-[#F4EFEA] shadow-sm ring-1 ring-[#D8C2A8]' : 'border-stone-200 bg-white hover:border-stone-300'
                        }`}
                      >
                        {estaSelecionado && <span className="absolute top-3 right-3 bg-[#B89267] text-white text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase">Selecionado</span>}
                        <div>
                          <h3 className="font-bold text-[#3D3023] text-lg pr-16">{p.nome}</h3>
                          <p className="text-xs text-stone-500 mt-1">{p.desc}</p>
                        </div>
                        
                        {ehDezMais && estaSelecionado ? (
                          <div className="mt-4 pt-3 border-t border-[#D8C2A8]/60" onClick={(e) => e.stopPropagation()}>
                            <label className="block text-xs font-bold text-[#4A3B2C] mb-1">Quantidade de ímãs:</label>
                            <input 
                              type="number" 
                              min="10" 
                              value={qtdCustomizada} 
                              onChange={(e) => setQtdCustomizada(e.target.value)} 
                              className="w-full px-3 py-1.5 rounded-lg border border-[#C5B097] text-sm font-bold bg-white" 
                            />
                            <div className="mt-2 flex justify-between items-baseline">
                              <span className="text-xs font-semibold text-[#8C6740]">{produtoAtual.qtd} ímãs</span>
                              <span className="text-xl font-extrabold text-[#3D3023]">R$ {produtoAtual.preco.toFixed(2)}</span>
                            </div>
                          </div>
                        ) : ehIndividualVariavel && estaSelecionado ? (
                          <div className="mt-4 pt-3 border-t border-[#D8C2A8]/60" onClick={(e) => e.stopPropagation()}>
                            <label className="block text-xs font-bold text-[#4A3B2C] mb-1">Quantidade:</label>
                            <input 
                              type="number" 
                              min="1" 
                              value={qtdIndividual} 
                              onChange={(e) => setQtdIndividual(e.target.value)} 
                              className="w-full px-3 py-1.5 rounded-lg border border-[#C5B097] text-sm font-bold bg-white" 
                            />
                            <div className="mt-2 flex justify-between items-baseline">
                              <span className="text-xs font-semibold text-[#8C6740]">{produtoAtual.qtd} unidade(s)</span>
                              <span className="text-xl font-extrabold text-[#3D3023]">R$ {produtoAtual.preco.toFixed(2)}</span>
                            </div>
                          </div>
                        ) : (
                          <div className="mt-4 flex justify-between items-baseline">
                            <span className="text-xs font-medium text-[#8C6740] bg-[#ECE5DB] px-2.5 py-1 rounded-lg">
                              {p.qtdPadrao} {p.qtdPadrao === 1 ? 'unidade' : 'fotos'}
                            </span>
                            <span className="text-xl font-extrabold text-[#3D3023]">R$ {p.precoPadrao.toFixed(2)}</span>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* FORMULÁRIO */}
              <div className="bg-white p-6 rounded-3xl border border-stone-200 shadow-sm space-y-5">
                <h3 className="text-lg font-bold text-[#3D3023] border-b border-stone-100 pb-3">Dados do Pedido</h3>

                {pedidoSucesso ? (
                  <div className="bg-[#FAF8F5] border border-[#D8C2A8] rounded-2xl p-5 text-center space-y-4 shadow-sm">
                    <h4 className="font-bold text-[#3D3023] text-base">Pedido Registrado com Sucesso!</h4>
                    <div className="text-xs text-stone-600 text-left bg-white p-3 rounded-xl border border-stone-200 space-y-1.5">
                      <p><strong>Código:</strong> <span className="text-stone-800">{pedidoSucesso.id}</span></p>
                      <p><strong>Produto:</strong> {pedidoSucesso.kit}</p>
                      <p><strong>Opção de Entrega:</strong> {pedidoSucesso.freteInfo}</p>
                      <p><strong>Endereço:</strong> {pedidoSucesso.endereco}</p>
                      <p className="pt-1 border-t border-stone-100"><strong>Total Geral:</strong> <span className="text-[#8C6740] font-bold">R$ {pedidoSucesso.valorTotal.toFixed(2)}</span></p>
                    </div>
                    <a
                      href={`https://wa.me/5513997018999?text=${encodeURIComponent(`Olá! Fiz o pedido ${pedidoSucesso.id}.\n\n*Cliente:* ${pedidoSucesso.cliente}\n*Produto:* ${pedidoSucesso.kit}\n*Entrega:* ${pedidoSucesso.freteInfo}\n*Endereço:* ${pedidoSucesso.endereco}\n*Total:* R$ ${pedidoSucesso.valorTotal.toFixed(2)}\n\nPoderia me enviar o link de pagamento do Nubank?`)}`}
                      target="_blank"
                      rel="noreferrer"
                      className="inline-block w-full py-3.5 bg-[#B89267] text-white rounded-xl font-bold text-xs hover:bg-[#A37B50] transition shadow-sm"
                    >
                      Enviar no WhatsApp (Nubank)
                    </a>
                  </div>
                ) : (
                  <form onSubmit={handleEnviarPedido} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-stone-600 mb-1">Nome Completo</label>
                      <input type="text" required placeholder="Ex: Ana Souza" value={clienteNome} onChange={(e) => setClienteNome(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#B89267]" />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-stone-600 mb-1">WhatsApp de Contato</label>
                      <input type="tel" required placeholder="(15) 99999-9999" value={clienteWhats} onChange={(e) => setClienteWhats(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#B89267]" />
                    </div>

                    {/* CAMPO DE CEP E LÓGICA CONDICIONAL DE FRETE */}
                    <div>
                      <label className="block text-xs font-semibold text-stone-600 mb-1">CEP de Destino</label>
                      <input
                        type="text"
                        maxLength="9"
                        required
                        placeholder="Ex: 18200-000"
                        value={cepDestino}
                        onChange={handleCEPChange}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#B89267]"
                      />

                      {cepDestino.replace(/\D/g, '').length === 8 && (
                        <div className="mt-2.5 space-y-3">
                          {tipoEntrega === 'local' ? (
                            <div className="bg-[#F4EFEA] border border-[#D8C2A8] p-3 rounded-xl text-xs space-y-2">
                              <p className="font-bold text-[#3D3023]">📍 Itapetininga/SP (Entrega local)</p>
                              <div className="flex gap-2">
                                <button
                                  type="button"
                                  onClick={() => setFreteSelecionado({ nome: 'Retirada na loja', valor: 0.00, prazo: 'Grátis' })}
                                  className={`flex-1 p-2 rounded-lg border text-center transition ${freteSelecionado.nome.includes('Retirada') ? 'bg-[#B89267] text-white font-bold' : 'bg-white text-stone-700'}`}
                                >
                                  Retirada (Grátis)
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setFreteSelecionado({ nome: 'Entrega Local', valor: 10.00, prazo: 'A combinar' })}
                                  className={`flex-1 p-2 rounded-lg border text-center transition ${freteSelecionado.nome.includes('Entrega') ? 'bg-[#B89267] text-white font-bold' : 'bg-white text-stone-700'}`}
                                >
                                  Entrega (R$ 10,00)
                                </button>
                              </div>
                            </div>
                          ) : (
                            <div className="space-y-2 pt-1">
                              <button
                                type="button"
                                onClick={handleCalcularFreteCorreios}
                                disabled={calculandoFrete}
                                className="w-full py-2 bg-[#8C6740] text-white rounded-xl font-bold text-xs hover:bg-[#725232] transition"
                              >
                                {calculandoFrete ? "Calculando frete..." : "Consultar Frete"}
                              </button>

                              {opcoesFrete.length > 0 && (
                                <div className="space-y-1.5">
                                  {opcoesFrete.map((op, idx) => (
                                    <div
                                      key={idx}
                                      onClick={() => setFreteSelecionado(op)}
                                      className={`p-2.5 rounded-xl border text-xs cursor-pointer flex justify-between items-center transition ${
                                        freteSelecionado.nome === op.nome ? 'border-[#B89267] bg-[#F4EFEA] font-bold' : 'border-stone-200 bg-white'
                                      }`}
                                    >
                                      <span>{op.nome} ({op.prazo})</span>
                                      <span className="font-extrabold text-[#8C6740]">R$ {op.valor.toFixed(2)}</span>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          )}

                          {exigeEndereco && (
                            <div className="bg-stone-50 p-3.5 rounded-2xl border border-stone-200 space-y-2.5 pt-3">
                              <h4 className="text-xs font-bold text-[#3D3023]">Endereço de Entrega *</h4>
                              
                              <div>
                                <input
                                  type="text"
                                  required
                                  placeholder="Rua / Avenida *"
                                  value={rua}
                                  onChange={(e) => setRua(e.target.value)}
                                  className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs focus:outline-none focus:ring-2 focus:ring-[#B89267]"
                                />
                              </div>

                              <div className="grid grid-cols-2 gap-2">
                                <input
                                  type="text"
                                  required
                                  placeholder="Número *"
                                  value={numero}
                                  onChange={(e) => setNumero(e.target.value)}
                                  className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs focus:outline-none focus:ring-2 focus:ring-[#B89267]"
                                />
                                <input
                                  type="text"
                                  required
                                  placeholder="Bairro *"
                                  value={bairro}
                                  onChange={(e) => setBairro(e.target.value)}
                                  className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs focus:outline-none focus:ring-2 focus:ring-[#B89267]"
                                />
                              </div>

                              <div>
                                <input
                                  type="text"
                                  placeholder="Complemento / Ponto de Ref. (Opcional)"
                                  value={complemento}
                                  onChange={(e) => setComplemento(e.target.value)}
                                  className="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs focus:outline-none focus:ring-2 focus:ring-[#B89267]"
                                />
                              </div>
                            </div>
                          )}
                        </div>
                      )}
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-stone-600 mb-1">
                        Selecione as Fotos ({usarMesmaFoto ? '1 foto para todos' : `${produtoAtual.qtd} necessária(s)`})
                      </label>
                      <div className="border-2 border-dashed border-[#D8C2A8] bg-[#FAF8F5] rounded-2xl p-4 text-center relative cursor-pointer">
                        <input 
                          type="file" 
                          multiple={!usarMesmaFoto && produtoAtual.qtd > 1} 
                          required 
                          accept="image/*" 
                          onChange={(e) => setFotosUpload(Array.from(e.target.files))} 
                          className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" 
                        />
                        <div className="text-[#B89267] mx-auto w-8 h-8 mb-1 flex justify-center items-center"><UploadIcon /></div>
                        <span className="text-xs text-stone-700 font-medium block">
                          {usarMesmaFoto ? "Clique para carregar 1 foto" : "Clique para carregar imagens"}
                        </span>
                      </div>

                      {produtoAtual.qtd > 1 && (
                        <div className="mt-2.5 flex items-center gap-2">
                          <input
                            type="checkbox"
                            id="mesmaFoto"
                            checked={usarMesmaFoto}
                            onChange={(e) => {
                              setUsarMesmaFoto(e.target.checked);
                              setFotosUpload([]);
                            }}
                            className="w-4 h-4 text-[#B89267] rounded border-stone-300 focus:ring-[#B89267] cursor-pointer"
                          />
                          <label htmlFor="mesmaFoto" className="text-xs text-stone-700 font-medium cursor-pointer select-none">
                            Utilizar a mesma foto para todas as {produtoAtual.qtd} unidades
                          </label>
                        </div>
                      )}

                      {fotosUpload.length > 0 && (
                        <div className={`mt-2 text-[11px] font-semibold ${quantidadeFotosValida ? 'text-emerald-700' : 'text-amber-700'}`}>
                          {quantidadeFotosValida 
                            ? (usarMesmaFoto ? `✓ 1 foto selecionada (será aplicada em todas as ${produtoAtual.qtd} unidades)` : `✓ ${fotosUpload.length} foto(s) selecionada(s)`) 
                            : (usarMesmaFoto ? `⚠ Selecione exatamente 1 foto.` : `⚠ Selecione exatamente ${produtoAtual.qtd} foto(s).`)}
                        </div>
                      )}
                    </div>

                    <div className="bg-[#FAF8F5] p-3 rounded-xl border border-[#E8DFC8] space-y-1 text-xs">
                      <div className="flex justify-between text-stone-600"><span>Produto:</span><span>R$ {produtoAtual.preco.toFixed(2)}</span></div>
                      <div className="flex justify-between text-stone-600"><span>Frete ({freteSelecionado.nome}):</span><span>R$ {(freteSelecionado.valor || 0).toFixed(2)}</span></div>
                      <div className="flex justify-between items-center border-t border-stone-200 pt-2 font-extrabold text-sm text-[#8C6740]">
                        <span>Total Geral:</span>
                        <span>R$ {valorTotalGeral.toFixed(2)}</span>
                      </div>
                    </div>

                    <button
                      type="submit"
                      disabled={carregando || !quantidadeFotosValida}
                      className={`w-full py-3.5 rounded-xl font-bold text-sm shadow-md transition ${
                        carregando || !quantidadeFotosValida ? 'bg-stone-200 text-stone-400 cursor-not-allowed' : 'bg-gradient-to-r from-[#B89267] to-[#8C6740] text-white hover:opacity-95'
                      }`}
                    >
                      {carregando ? "A enviar..." : "Concluir Pedido"}
                    </button>
                  </form>
                )}
              </div>

            </div>
          </main>

          <footer className="bg-white border-t border-stone-200 py-6 text-center text-xs text-stone-500 space-y-3">
            <div className="flex justify-center items-center space-x-4">
              <a href="https://www.instagram.com/gifts.jv" target="_blank" rel="noreferrer" className="w-9 h-9 bg-[#F4EFEA] hover:bg-[#EAE0D5] text-[#8C6740] rounded-full flex items-center justify-center transition"><InstagramIcon /></a>
              <a href="https://wa.me/5513997018999" target="_blank" rel="noreferrer" className="w-9 h-9 bg-[#F4EFEA] hover:bg-[#EAE0D5] text-[#8C6740] rounded-full flex items-center justify-center transition"><WhatsappIcon /></a>
            </div>
            <p className="font-medium text-stone-600">JV Gifts Personalizados • Itapetininga/SP</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
