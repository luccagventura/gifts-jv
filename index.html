<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto Ímã Itapetininga - Sistema de Pedidos e Insumos</title>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest"></script>
  <!-- Fontes Google -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons
    const CameraIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    );

    const PackageIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
    );

    const LayersIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 12.5-8.58 3.91a2 2 0 0 1-1.66 0L3.18 12.5"/><path d="m22 17.5-8.58 3.91a2 2 0 0 1-1.66 0L3.18 17.5"/></svg>
    );

    const QrCodeIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
    );

    const CheckCircleIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    );

    const AlertTriangleIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
    );

    const UploadIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
    );

    // Main App Component
    function App() {
      const [tab, setTab] = useState('cliente'); // 'cliente', 'admin', 'qrcode'

      // Dados dos Kits
      const kits = [
        { id: 'polaroid', nome: 'Kit Polaroid Magneto', qtd: 9, preco: 35.00, desc: '9 Ímãs estilo Polaroid (7x9cm) com legenda personalizada', insumoManta: 0.08, insumoPapel: 1 },
        { id: 'quadrado', nome: 'Kit Instax Quadrado', qtd: 12, preco: 40.00, desc: '12 Ímãs Quadrados (6.5x6.5cm) estilo Instagram', insumoManta: 0.09, insumoPapel: 1 },
        { id: 'mosaico', nome: 'Mosaico Magnético A4', qtd: 1, preco: 45.00, desc: '1 Foto dividida em 6 peças magnéticas que formam um quadro', insumoManta: 0.12, insumoPapel: 1 },
        { id: 'lembranca', nome: 'Kit Lembrancinha Festa', qtd: 15, preco: 50.00, desc: '15 Mini-ímãs (5x5cm) ideais para aniversários e eventos', insumoManta: 0.10, insumoPapel: 2 },
      ];

      // Estado dos Pedidos
      const [pedidos, setPedidos] = useState([
        { id: 'PED-1024', cliente: 'Mariana Silva', kit: 'Kit Polaroid Magneto', qtdFotos: 9, valor: 35.00, status: 'Pronto para Retirada', data: '21/10/2026', whatsapp: '15998112233' },
        { id: 'PED-1025', cliente: 'Carlos Eduardo', kit: 'Kit Instax Quadrado', qtdFotos: 12, valor: 40.00, status: 'Em Impressão', data: '21/10/2026', whatsapp: '15997223344' },
        { id: 'PED-1026', cliente: 'Fernanda Oliveira', kit: 'Mosaico Magnético A4', qtdFotos: 1, valor: 45.00, status: 'Pendente', data: '21/10/2026', whatsapp: '15996334455' },
      ]);

      // Estado do Estoque de Insumos
      const [estoque, setEstoque] = useState([
        { id: 'manta', nome: 'Manta Magnética Adesivada 0.3mm', saldo: 12.5, min: 5.0, unidade: 'm²' },
        { id: 'papel', nome: 'Papel Fotográfico Glossy 230g', saldo: 45, min: 50, unidade: 'folhas A4' },
        { id: 'lamination', nome: 'Película de Laminação Polaseal/BOPP', saldo: 80, min: 30, unidade: 'folhas A4' },
      ]);

      // Formulário do Cliente
      const [clienteNome, setClienteNome] = useState('');
      const [clienteWhats, setClienteWhats] = useState('');
      const [kitSelecionado, setKitSelecionado] = useState(kits[0].id);
      const [fotosUpload, setFotosUpload] = useState([]);
      const [pedidoSucesso, setPedidoSucesso] = useState(null);

      // Função de Envio de Pedido pelo Cliente
      const handleEnviarPedido = (e) => {
        e.preventDefault();
        const kitObj = kits.find(k => k.id === kitSelecionado);
        const novoId = `PED-${1027 + pedidos.length}`;
        
        const novoPedido = {
          id: novoId,
          cliente: clienteNome,
          kit: kitObj.nome,
          qtdFotos: kitObj.qtd,
          valor: kitObj.preco,
          status: 'Pendente',
          data: new Date().toLocaleDateString('pt-BR'),
          whatsapp: clienteWhats
        };

        // Atualiza Pedidos
        setPedidos([novoPedido, ...pedidos]);

        // Baixa automática simulada no Estoque
        setEstoque(prevEstoque => prevEstoque.map(item => {
          if (item.id === 'manta') return { ...item, saldo: +(item.saldo - kitObj.insumoManta).toFixed(2) };
          if (item.id === 'papel') return { ...item, saldo: item.saldo - kitObj.insumoPapel };
          if (item.id === 'lamination') return { ...item, saldo: item.saldo - kitObj.insumoPapel };
          return item;
        }));

        setPedidoSucesso(novoPedido);
        // Reset form
        setClienteNome('');
        setClienteWhats('');
        setFotosUpload([]);
      };

      // Alterar Status do Pedido no Painel Admin
      const handleMudarStatus = (id, novoStatus) => {
        setPedidos(pedidos.map(p => p.id === id ? { ...p, status: novoStatus } : p));
      };

      // Simular Upload
      const handleSimularUpload = (e) => {
        const files = Array.from(e.target.files);
        setFotosUpload(files.map(f => f.name));
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* HEADER / NAVIGATION */}
          <header className="bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 text-white shadow-lg">
            <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center space-x-3">
                <div className="bg-white text-pink-600 p-2.5 rounded-2xl shadow-inner font-black text-xl">
                  📸
                </div>
                <div>
                  <h1 className="text-xl font-bold leading-tight">Foto Ímã Itapetininga</h1>
                  <p className="text-xs text-pink-100">Ateliê de Lembranças & Memória Afetiva • Apoio Extensionista</p>
                </div>
              </div>

              {/* NAV TABS */}
              <nav className="flex bg-white/10 p-1 rounded-xl backdrop-blur-md">
                <button
                  onClick={() => setTab('cliente')}
                  className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center space-x-2 ${
                    tab === 'cliente' ? 'bg-white text-pink-600 shadow-sm' : 'text-white hover:bg-white/10'
                  }`}
                >
                  <CameraIcon />
                  <span>Fazer Pedido</span>
                </button>
                <button
                  onClick={() => setTab('admin')}
                  className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center space-x-2 ${
                    tab === 'admin' ? 'bg-white text-pink-600 shadow-sm' : 'text-white hover:bg-white/10'
                  }`}
                >
                  <PackageIcon />
                  <span>Painel Ateliê ({pedidos.filter(p => p.status === 'Pendente').length})</span>
                </button>
                <button
                  onClick={() => setTab('qrcode')}
                  className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center space-x-2 ${
                    tab === 'qrcode' ? 'bg-white text-pink-600 shadow-sm' : 'text-white hover:bg-white/10'
                  }`}
                >
                  <QrCodeIcon />
                  <span>Link Bio / Instagram</span>
                </button>
              </nav>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">

            {/* TAB 1: AREA DO CLIENTE */}
            {tab === 'cliente' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                {/* LADO ESQUERDO: CATÁLOGO DE KITS */}
                <div className="lg:col-span-2 space-y-6">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-800">Escolha o seu Kit de Foto-Ímãs</h2>
                    <p className="text-slate-500 text-sm">Selecione o modelo desejado, envie suas fotos do celular e receba direto em Itapetininga.</p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {kits.map((k) => (
                      <div
                        key={k.id}
                        onClick={() => setKitSelecionado(k.id)}
                        className={`cursor-pointer rounded-2xl p-5 border-2 transition-all relative ${
                          kitSelecionado === k.id
                            ? 'border-pink-500 bg-pink-50/50 shadow-md ring-2 ring-pink-200'
                            : 'border-slate-200 bg-white hover:border-slate-300'
                        }`}
                      >
                        {kitSelecionado === k.id && (
                          <span className="absolute top-3 right-3 bg-pink-500 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase">
                            Selecionado
                          </span>
                        )}
                        <h3 className="font-bold text-slate-800 text-lg">{k.nome}</h3>
                        <p className="text-xs text-slate-500 mt-1">{k.desc}</p>
                        <div className="mt-4 flex justify-between items-baseline">
                          <span className="text-xs font-medium text-pink-600 bg-pink-100/60 px-2.5 py-1 rounded-lg">
                            {k.qtd} fotos
                          </span>
                          <span className="text-xl font-extrabold text-slate-900">
                            R$ {k.preco.toFixed(2)}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* ALERTA EXTENSIONISTA */}
                  <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-2xl p-4 text-xs text-blue-900 flex items-start space-x-3">
                    <div className="text-blue-600 mt-0.5"><LayersIcon /></div>
                    <div>
                      <strong className="font-semibold block">Projeto Extensionista de Engenharia de Software</strong>
                      Esta plataforma automatiza a captação de pedidos do artesão local em Itapetininga, reduzindo o tempo de atendimento no WhatsApp e integrando a produção diretamente com o controle de estoque de matéria-prima.
                    </div>
                  </div>
                </div>

                {/* LADO DIREITO: FORMULÁRIO DE ENVIOS E UPLOAD */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-5">
                  <h3 className="text-lg font-bold text-slate-800 border-b border-slate-100 pb-3">
                    Envio das Fotos & Dados
                  </h3>

                  {pedidoSucesso ? (
                    <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-5 text-center space-y-3">
                      <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                        ✓
                      </div>
                      <h4 className="font-bold text-emerald-900 text-base">Pedido Recebido com Sucesso!</h4>
                      <p className="text-xs text-emerald-700">
                        Código: <strong>{pedidoSucesso.id}</strong><br />
                        O ateliê em Itapetininga já recebeu suas fotos e iniciará a impressão em breve.
                      </p>
                      <a
                        href={`https://wa.me/55${pedidoSucesso.whatsapp}?text=Olá!%20Fiz%20o%20pedido%20${pedidoSucesso.id}%20no%20site%20para%20o%20kit%20${encodeURIComponent(pedidoSucesso.kit)}.`}
                        target="_blank"
                        rel="noreferrer"
                        className="inline-block w-full py-3 bg-emerald-600 text-white rounded-xl font-bold text-xs hover:bg-emerald-700 transition"
                      >
                        Confirmar pelo WhatsApp
                      </a>
                      <button
                        onClick={() => setPedidoSucesso(null)}
                        className="text-xs text-slate-400 underline block mx-auto pt-2"
                      >
                        Fazer novo pedido
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleEnviarPedido} className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">Seu Nome Completo</label>
                        <input
                          type="text"
                          required
                          placeholder="Ex: Maria Aparecida"
                          value={clienteNome}
                          onChange={(e) => setClienteNome(e.target.value)}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">WhatsApp para Contato</label>
                        <input
                          type="tel"
                          required
                          placeholder="(15) 99999-9999"
                          value={clienteWhats}
                          onChange={(e) => setClienteWhats(e.target.value)}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">
                          Selecione as Fotos do seu Celular
                        </label>
                        <div className="border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center hover:bg-slate-50 transition cursor-pointer relative">
                          <input
                            type="file"
                            multiple
                            accept="image/*"
                            onChange={handleSimularUpload}
                            className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                          />
                          <div className="text-slate-400 mx-auto w-8 h-8 mb-1 flex justify-center items-center">
                            <UploadIcon />
                          </div>
                          <span className="text-xs text-slate-600 font-medium block">
                            Clique para selecionar ou arraste aqui
                          </span>
                          <span className="text-[10px] text-slate-400">
                            {kits.find(k => k.id === kitSelecionado)?.qtd} fotos necessárias para este kit
                          </span>
                        </div>
                        {fotosUpload.length > 0 && (
                          <div className="mt-2 text-[11px] text-emerald-600 font-medium">
                            ✓ {fotosUpload.length} foto(s) selecionada(s)
                          </div>
                        )}
                      </div>

                      <div className="pt-2">
                        <button
                          type="submit"
                          className="w-full py-3.5 bg-gradient-to-r from-pink-600 to-purple-600 text-white rounded-xl font-bold text-sm shadow-md hover:opacity-95 transition"
                        >
                          Enviar Fotos e Gerar Pedido
                        </button>
                        <p className="text-[10px] text-center text-slate-400 mt-2">
                          Ateliê localizado no Centro de Itapetininga/SP. Retirada no local ou entrega rápida.
                        </p>
                      </div>
                    </form>
                  )}
                </div>

              </div>
            )}

            {/* TAB 2: PAINEL ADMINISTRATIVO E ESTOQUE DE INSUMOS */}
            {tab === 'admin' && (
              <div className="space-y-8">
                
                {/* CARD DE ALERTA DE ESTOQUE DE INSUMOS */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-lg font-bold text-slate-800">Controle do Estoque de Insumos (Ateliê)</h2>
                      <p className="text-xs text-slate-500">Cálculo e baixa de matéria-prima calculados por cada foto-ímã produzido</p>
                    </div>
                    <span className="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-semibold">
                      Unidade Itapetininga
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {estoque.map((item) => {
                      const critico = item.saldo <= item.min;
                      return (
                        <div
                          key={item.id}
                          className={`p-4 rounded-2xl border ${
                            critico ? 'bg-amber-50/60 border-amber-300' : 'bg-slate-50 border-slate-200'
                          }`}
                        >
                          <div className="flex justify-between items-start">
                            <span className="text-xs font-bold text-slate-700">{item.nome}</span>
                            {critico && (
                              <span className="text-amber-600 text-[10px] bg-amber-100 px-2 py-0.5 rounded-full font-bold flex items-center gap-1">
                                <AlertTriangleIcon /> Repor
                              </span>
                            )}
                          </div>
                          <div className="mt-3 flex justify-between items-baseline">
                            <span className="text-2xl font-black text-slate-800">
                              {item.saldo} <span className="text-xs font-normal text-slate-500">{item.unidade}</span>
                            </span>
                            <span className="text-[11px] text-slate-400">Mín: {item.min} {item.unidade}</span>
                          </div>
                          {/* Progresso visual */}
                          <div className="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
                            <div
                              className={`h-full ${critico ? 'bg-amber-500' : 'bg-emerald-500'}`}
                              style={{ width: `${Math.min(100, (item.saldo / (item.min * 2)) * 100)}%` }}
                            ></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* TABELA DE PEDIDOS RECEBIDOS */}
                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                    <div>
                      <h2 className="text-lg font-bold text-slate-800">Fila de Pedidos de Foto-Ímãs</h2>
                      <p className="text-xs text-slate-500">Gestão das etapas de produção e avisos aos clientes de Itapetininga</p>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-500 uppercase text-[10px] tracking-wider border-b border-slate-100">
                        <tr>
                          <th className="p-4">Cód. / Data</th>
                          <th className="p-4">Cliente</th>
                          <th className="p-4">Kit Contratado</th>
                          <th className="p-4">Fotos</th>
                          <th className="p-4">Valor Total</th>
                          <th className="p-4">Status da Produção</th>
                          <th className="p-4 text-right">Ação</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 text-slate-700">
                        {pedidos.map((p) => (
                          <tr key={p.id} className="hover:bg-slate-50/50 transition">
                            <td className="p-4 font-bold text-slate-900">
                              {p.id}
                              <span className="block text-[10px] font-normal text-slate-400">{p.data}</span>
                            </td>
                            <td className="p-4">
                              <span className="font-semibold">{p.cliente}</span>
                              <span className="block text-[10px] text-slate-400">{p.whatsapp}</span>
                            </td>
                            <td className="p-4 font-medium text-slate-800">{p.kit}</td>
                            <td className="p-4">{p.qtdFotos} un.</td>
                            <td className="p-4 font-bold text-slate-900">R$ {p.valor.toFixed(2)}</td>
                            <td className="p-4">
                              <span
                                className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                  p.status === 'Pronto para Retirada'
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : p.status === 'Em Impressão'
                                    ? 'bg-blue-100 text-blue-800'
                                    : 'bg-amber-100 text-amber-800'
                                }`}
                              >
                                {p.status}
                              </span>
                            </td>
                            <td className="p-4 text-right space-x-1">
                              {p.status === 'Pendente' && (
                                <button
                                  onClick={() => handleMudarStatus(p.id, 'Em Impressão')}

                                >
                                  Concluir
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
